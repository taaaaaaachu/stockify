name: CI

# push(main)と全 PR で lint/型チェック/テストを回し、
# main に入ったものだけ Docker イメージをビルドして GHCR に配布する。
# NAS 側は Watchtower が GHCR を監視して自動 pull するため、ここでは配布まで。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # --- CI: 静的検査とテスト ---
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm の版は package.json の packageManager から決まる。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # svelte-kit sync は prepare(postinstall)で走る。
      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: 型チェック (svelte-check)
        run: pnpm check

      - name: テスト (vitest)
        run: pnpm test

  # --- CD の前半: main のイメージをビルドして GHCR へ push ---
  # NAS への反映は Watchtower が pull で行うので、ここはレジストリ配布まで。
  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR への push は GITHUB_TOKEN で完結(追加 secret 不要)
    steps:
      - uses: actions/checkout@v7

      # gha キャッシュ(cache-to: type=gha)は docker-container ドライバが必要。
      # 既定の docker ドライバはキャッシュエクスポート非対応なのでビルダーを用意する。
      - name: Buildx をセットアップ
        uses: docker/setup-buildx-action@v4

      - name: GHCR にログイン
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: タグ・ラベルを算出
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/taaaaaaachu/stockify
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: ビルドして GHCR へ push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }} # PR ではビルドの確認だけ行う
          platforms: linux/amd64 # NAS は x86_64。クロスビルド不要
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
