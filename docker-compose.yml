# Synology NAS 上で動かす想定の構成。
# app(SvelteKit/adapter-node)を cloudflared 経由で外部公開し、
# notify-cron が毎日 /api/cron/notify を叩いて購入リマインドを送る。
services:
  app:
    # GitHub Actions がビルドして GHCR に push したイメージを使う(NAS ではビルドしない)。
    # Watchtower がこのイメージの更新を監視し、新しい :latest を検知したら自動 pull → 再作成する。
    image: ghcr.io/taaaaaaachu/stockify:latest
    restart: unless-stopped
    # Watchtower の監視対象に含めるラベル(WATCHTOWER_LABEL_ENABLE=true と対で機能する)。
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      # adapter-node がリバースプロキシ配下で form action / CSRF 検証に使う公開オリジン。
      # 自分のサブドメインに合わせて変更する。
      - ORIGIN=${ORIGIN:-https://stock.example.com}
      - DATABASE_PATH=/data/app.sqlite
      - PORT=3000
      # 通知時刻の判定はサーバーのローカル時刻で行うため JST に固定する。
      - TZ=Asia/Tokyo
      # Web Push(VAPID)。`npx web-push generate-vapid-keys` で生成し .env に置く。
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      # 通知評価cron(/api/cron/notify)の共有シークレット。
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      # バインドマウント: SQLite はプロジェクト直下 data/ に置き、File Station で
      # そのままバックアップ/リストアできるようにする(SSH 不要)。
      - ./data:/data
    # 既定では外部ポートを公開せず、cloudflared 経由でのみ到達させる。
    expose:
      - "3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Cloudflare Zero Trust ダッシュボードで発行した Tunnel トークンを .env に置く。
    # Public Hostname のサービスは http://app:3000 に向ける。
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app

  # 通知評価cron: 15分ごとに app の通知エンドポイントを叩く。
  # 実際に送るかは app 側で各ユーザーの設定時刻スロットに該当するかで判断する。
  # busybox crond を使う軽量コンテナ。CRON_SECRET を Bearer トークンに使う。
  notify-cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - CRON_SECRET=${CRON_SECRET}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        printf '*/15 * * * * curl -s -X POST -H "Authorization: Bearer %s" http://app:3000/api/cron/notify >/dev/null 2>&1\n' "$$CRON_SECRET" > /etc/crontabs/root
        exec crond -f -l 8

  # イメージ自動更新(CD の後半)。GHCR を定期ポーリングし、app の :latest が更新されたら
  # 自動で pull → コンテナ再作成する。app 起動時に docker-entrypoint.sh がマイグレーションを
  # 適用するため、再作成だけで DB スキーマ更新も入る。
  # ※ 監視対象は enable ラベルの付いた app のみ(cloudflared / notify-cron は対象外)。
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
      - WATCHTOWER_LABEL_ENABLE=true # enable ラベルの付いたコンテナだけ監視
      - WATCHTOWER_CLEANUP=true # 入れ替え後に古いイメージを削除
      - WATCHTOWER_POLL_INTERVAL=300 # 5分ごとに GHCR をチェック
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR が private の場合のみ必要: NAS で `docker login ghcr.io` 済みの認証情報を渡す。
      # public 化する場合はこの行を削除してよい。
      - /root/.docker/config.json:/config.json:ro
